name: CS Launcher V2 CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build APKs
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          validate-wrappers: false
          gradle-version: '8.11'

      - name: Prepare build
        shell: bash
        run: |
          chmod +x ./gradlew

          if [ -f ./scripts/languagelist_updater.sh ]; then
            chmod +x ./scripts/languagelist_updater.sh
            ./scripts/languagelist_updater.sh
          fi

      - name: Build release APK
        shell: bash
        run: |
          ./gradlew :app_pojavlauncher:assembleRelease \
            --no-daemon \
            --stacktrace

      - name: Build debug APK
        shell: bash
        run: |
          ./gradlew :app_pojavlauncher:assembleDebug \
            --no-daemon

      - name: Collect APKs
        shell: bash
        run: |
          set -e

          mkdir -p out

          RELEASE_APK="$(find app_pojavlauncher/build/outputs/apk/release \
            -type f -name '*.apk' | head -n 1)"

          DEBUG_APK="$(find app_pojavlauncher/build/outputs/apk/debug \
            -type f -name '*.apk' | head -n 1)"

          if [ -z "$RELEASE_APK" ]; then
            echo "Release APK not found"
            exit 1
          fi

          if [ -z "$DEBUG_APK" ]; then
            echo "Debug APK not found"
            exit 1
          fi

          cp "$RELEASE_APK" out/NEXUS-LAUNCHER-v3-release.apk
          cp "$DEBUG_APK" out/NEXUS-LAUNCHER-v3-debug.apk

          sha256sum out/*.apk > out/checksums.sha256

          echo "Generated APKs:"
          ls -lh out/

      - name: Upload APK artifacts
        uses: actions/upload-artifact@v4
        with:
          name: nexus-launcher-v3-apks-${{ github.run_number }}
          path: out/
          if-no-files-found: error
          retention-days: 30
