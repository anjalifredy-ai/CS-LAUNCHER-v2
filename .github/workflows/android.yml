name: CS Launcher V2 CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Download JRE 8
        uses: dawidd6/action-download-artifact@v6
        with:
          workflow: build.yml
          path: app_pojavlauncher/src/main/assets/components/jre
          workflow_conclusion: success
          repo: AngelAuraMC/angelauramc-openjdk-build
          branch: buildjre8
          name: jre8-pojav

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          validate-wrappers: false
          gradle-version: '8.11'

      - name: Fix Android string escapes
        shell: bash
        run: |
          find app_pojavlauncher/src/main/res -type f -name 'strings.xml' -print0 | while IFS= read -r -d '' file; do
            sed -i "s/\\\\'/'/g" "$file"
          done

      - name: Prepare build
        run: |
          chmod +x ./gradlew
          chmod +x ./scripts/languagelist_updater.sh
          ./scripts/languagelist_updater.sh

      - name: Build release APK
        run: ./gradlew :app_pojavlauncher:assembleRelease --no-daemon --stacktrace

      - name: Build debug APK
        run: ./gradlew :app_pojavlauncher:assembleDebug --no-daemon

      - name: Collect APKs
        shell: bash
        run: |
          set -e
          mkdir -p out
          release_apk=$(find app_pojavlauncher/build/outputs/apk/release -name '*.apk' | head -n 1)
          debug_apk=$(find app_pojavlauncher/build/outputs/apk/debug -name '*.apk' | head -n 1)
          test -n "$release_apk"
          test -n "$debug_apk"
          cp "$release_apk" out/NEXUS-LAUNCHER-v3-release.apk
          cp "$debug_apk" out/NEXUS-LAUNCHER-v3-debug.apk
          sha256sum out/*.apk > out/checksums.sha256

      - name: Upload APK artifacts
        uses: actions/upload-artifact@v4
        with:
          name: nexus-launcher-v3-apks-${{ github.run_number }}
          path: out/
          retention-days: 30
