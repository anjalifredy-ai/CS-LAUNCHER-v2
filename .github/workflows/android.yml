name: CS Launcher V2 CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build Android APKs
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          validate-wrappers: false
          gradle-version: '8.11'

      - name: Update language list
        shell: bash
        run: |
          if [ -f ./scripts/languagelist_updater.sh ]; then
            chmod +x ./scripts/languagelist_updater.sh
            ./scripts/languagelist_updater.sh
          fi

      - name: Repair all Android string resources
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path
          import re

          resource_root = Path("app_pojavlauncher/src/main/res")

          for path in resource_root.rglob("strings.xml"):
              text = path.read_text(encoding="utf-8")

              # Fix malformed escapes created by translation generators / bad strings
              text = re.sub(r"\\u(?![0-9a-fA-F]{4})", "", text)
              text = text.replace("\\'", "'")

              path.write_text(text, encoding="utf-8")
              print(f"Repaired: {path}")
          PY

      - name: Validate string resources
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path
          import re
          import sys

          failed = False

          for path in Path("app_pojavlauncher/src/main/res").rglob("strings.xml"):
              text = path.read_text(encoding="utf-8")
              invalid = re.findall(r"\\u(?![0-9a-fA-F]{4})", text)
              if invalid:
                  print(f"Invalid Unicode escape remains in {path}")
                  failed = True

          if failed:
              sys.exit(1)

          print("Android string resource validation passed")
          PY

      - name: Make Gradle executable
        shell: bash
        run: chmod +x ./gradlew

      - name: Build release APK
        shell: bash
        run: |
          ./gradlew :app_pojavlauncher:assembleRelease \
            --no-daemon \
            --stacktrace

      - name: Build debug APK
        shell: bash
        run: |
          ./gradlew :app_pojavlauncher:assembleDebug \
            --no-daemon

      - name: Collect APK files
        shell: bash
        run: |
          set -e

          mkdir -p out

          RELEASE_APK="$(find app_pojavlauncher/build/outputs/apk/release -type f -name '*.apk' | head -n 1)"
          DEBUG_APK="$(find app_pojavlauncher/build/outputs/apk/debug -type f -name '*.apk' | head -n 1)"

          if [ -z "$RELEASE_APK" ]; then
            echo "ERROR: Release APK was not found"
            exit 1
          fi

          if [ -z "$DEBUG_APK" ]; then
            echo "ERROR: Debug APK was not found"
            exit 1
          fi

          cp "$RELEASE_APK" out/NEXUS-LAUNCHER-v3-release.apk
          cp "$DEBUG_APK" out/NEXUS-LAUNCHER-v3-debug.apk

          sha256sum out/*.apk > out/checksums.sha256
          ls -lh out/

      - name: Upload APK artifacts
        uses: actions/upload-artifact@v4
        with:
          name: nexus-launcher-v3-apks-${{ github.run_number }}
          path: out/
          if-no-files-found: error
          retention-days: 30
