plugins {
    id 'com.android.application' version '8.7.2'
}

static def getDate() {
    return new Date().format('yyyyMMdd')
}

def getVersionName = {
    String semVer = "1.1.5"

    ByteArrayOutputStream TAG = new ByteArrayOutputStream()

    try {
        exec {
            commandLine 'git', 'describe', '--tags'
            ignoreExitValue true
            standardOutput = TAG
        }
    } catch (Exception e) {
        logger.warn("Could not get git tag: ${e.message}")
    }

    String tagStr = TAG.toString().trim()

    if (!tagStr.isEmpty()) {
        if (tagStr ==~ /^v?\d+\.\d+\.\d+.*/) {
            return tagStr
        }
    }

    return "v" + semVer
}

def getCFApiKey = {
    String key = System.getenv("CURSEFORGE_API_KEY")

    if (key != null && !key.trim().isEmpty()) {
        return key
    }

    File curseforgeKeyFile = new File("$projectDir/curseforge_key.txt")

    if (curseforgeKeyFile.canRead() && curseforgeKeyFile.isFile()) {
        return curseforgeKeyFile.text.trim()
    }

    logger.warn("BUILD: No CurseForge API key, CurseForge API will be disabled.")
    return "DUMMY"
}

configurations {
    instrumentedClasspath {
        canBeConsumed = false
        canBeResolved = true
    }
}

android {
    namespace 'net.kdt.pojavlaunch'

    compileSdk = 34

    lint {
        checkReleaseBuilds = false
        abortOnError = false
    }

    /*
     * External release signing has been disabled.
     *
     * This prevents GitHub Actions from trying to read
     * keystore.jks and causing:
     *
     * KeytoolException:
     * Tag number over 30 is not supported
     */

    signingConfigs {
        customDebug {
            storeFile file("debug.keystore")
            storePassword "android"
            keyAlias "androiddebugkey"
            keyPassword "android"
        }
    }

    defaultConfig {
        applicationId "com.craftstudio.cslauncher"

        minSdkVersion 21
        targetSdkVersion 34

        versionCode 10000000
        versionName getVersionName()

        multiDexEnabled true

        resValue 'string', 'curseforge_api_key', getCFApiKey()

        externalNativeBuild {
            ndkBuild {
                arguments "APP_SHORT_COMMANDS=true"
            }
        }
    }

    buildTypes {

        debug {
            applicationIdSuffix '.debug'

            minifyEnabled false
            shrinkResources false

            proguardFiles \
                    getDefaultProguardFile('proguard-android-optimize.txt'), \
                    'proguard-rules.pro'

            signingConfig signingConfigs.customDebug

            resValue "string", "app_name", "CS LAUNCHER V2"
            resValue "string", "app_short_name", "CS LAUNCHER V2"

            resValue 'string',
                    'application_package',
                    'com.craftstudio.cslauncher.debug'

            resValue 'string',
                    'storageProviderAuthorities',
                    'com.craftstudio.cslauncher.scoped.gamefolder.debug'

            resValue 'string',
                    'shareProviderAuthority',
                    'com.craftstudio.cslauncher.scoped.controlfolder.debug'
        }

        proguard {
            initWith debug

            minifyEnabled true
            shrinkResources true

            debuggable false
        }

        proguardNoDebug {
            initWith proguard

            debuggable false
        }

        release {
            minifyEnabled false
            shrinkResources false
            debuggable false

            proguardFiles \
                    getDefaultProguardFile('proguard-android.txt'), \
                    'proguard-rules.pro'

            /*
             * IMPORTANT:
             * No external keystore is used here.
             *
             * Do NOT add:
             *
             * signingConfig signingConfigs.release
             */

            resValue "string", "app_name", "CS LAUNCHER V2"
            resValue "string", "app_short_name", "CS LAUNCHER V2"

            resValue 'string',
                    'storageProviderAuthorities',
                    'com.craftstudio.cslauncher.gamefolder'

            resValue 'string',
                    'application_package',
                    'com.craftstudio.cslauncher'
        }

        gplay {
            initWith release
            matchingFallbacks = ['release']
        }
    }

    ndkVersion = "27.3.13750724"

    externalNativeBuild {
        ndkBuild {
            path file('src/main/jni/Android.mk')
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    bundle {
        language {
            enableSplit = false
        }
    }

    packagingOptions {
        jniLibs {
            useLegacyPackaging = true
        }

        doNotStrip += [
                "**/libcutils.so"
        ]

        pickFirst '**/libbytehook.so'
    }

    buildFeatures {
        prefab true
        buildConfig true
    }

    buildToolsVersion = '34.0.0'
}

afterEvaluate {

    tasks.mergeDebugAssets.dependsOn(
            ":forge_installer:jar",
            ":arc_dns_injector:jar",
            ":methods_injector_agent:jar",
            ":jre_lwjgl3glfw:jar"
    )

    tasks.mergeReleaseAssets.dependsOn(
            ":forge_installer:jar",
            ":arc_dns_injector:jar",
            ":methods_injector_agent:jar",
            ":jre_lwjgl3glfw:jar"
    )
}

dependencies {

    implementation 'javax.annotation:javax.annotation-api:1.3.2'

    implementation 'commons-codec:commons-codec:1.15'

    implementation 'androidx.preference:preference:1.2.0'

    implementation 'androidx.palette:palette:1.0.0'

    implementation 'androidx.drawerlayout:drawerlayout:1.2.0'

    implementation 'androidx.viewpager2:viewpager2:1.1.0-beta01'

    implementation 'androidx.annotation:annotation:1.5.0'

    implementation 'androidx.constraintlayout:constraintlayout:2.1.4'

    implementation 'com.github.duanhong169:checkerboarddrawable:1.0.2'

    implementation 'com.github.PojavLauncherTeam:portrait-sdp:ed33e89cbc'

    implementation 'com.github.PojavLauncherTeam:portrait-ssp:6c02fd739b'

    implementation 'com.github.Mathias-Boulay:ExtendedView:1.0.0'

    implementation 'com.github.Mathias-Boulay:android_gamepad_remapper:2.0.3'

    implementation 'com.github.Mathias-Boulay:virtual-joystick-android:1.14'

    implementation 'org.tukaani:xz:1.8'

    implementation 'net.sourceforge.htmlcleaner:htmlcleaner:2.6.1'

    implementation 'com.bytedance:bytehook:1.0.9'

    implementation 'top.fifthlight.touchcontroller:proxy-client-android:0.0.4'

    implementation fileTree(
            dir: 'libs',
            include: ['*.jar', '*.aar']
    )

    implementation "net.java.dev.jna:jna:5.13.0@aar"

    implementation 'com.google.android.material:material:1.12.0'
}
